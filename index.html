<!DOCTYPE html>
<html lang="hat">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alifoot - Final la an Dirèk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        header h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            font-weight: 800;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Kat Match Pwofesyonèl */
        .match-card {
            width: 100%;
            background: #151a24;
            border-radius: 16px;
            border: 1px solid #1f2635;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        .live-badge {
            background-color: #e50914;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
            letter-spacing: 1px;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .vs-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 25px;
        }
        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .team img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #1f2635;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #fff;
        }
        .team span {
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .vs {
            font-size: 22px;
            font-weight: 900;
            color: #38ef7d;
            font-style: italic;
            padding: 0 10px;
        }
        .match-title {
            font-size: 14px;
            color: #a0aab5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Gwo Bouton Play la */
        .btn-play {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            text-transform: uppercase;
        }
        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.5);
        }
        .btn-play:active {
            transform: translateY(0);
        }
        .play-icon {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-left: 14px solid white;
            border-bottom: 8px solid transparent;
        }

        footer {
            background-color: #07090d;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #4a5568;
            border-top: 1px solid #111;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚽ alifoot</h1>
    </header>

    <main>
        <div class="match-card">
            <span class="live-badge">🔴 EN DIRECT</span>
            
            <div class="match-title">GRAND FINAL LA</div>

            <div class="vs-container">
                <!-- Argentine -->
                <div class="team">
                    <img src="https://flagcdn.com/w160/ar.png" alt="Argentine">
                    <span>ARGENTINE</span>
                </div>

                <div class="vs">VS</div>

                <!-- Espagne -->
                <div class="team">
                    <img src="https://flagcdn.com/w160/es.png" alt="Espagne">
                    <span>ESPAGNE</span>
                </div>
            </div>

            <!-- Bouton PLAY k ap ouvri lyen an dirèk la san bloke nan iframe -->
            <a id="play-link" href="#" target="_blank" class="btn-play">
                <div class="play-icon"></div> KLIKE POU GADE MATCH LA
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 alifoot - Tout dwa rezève.
    </footer>

    <script>
        // Lyen videyo a an Base64
        const kodMatch = "aHR0cHM6Ly9sYXRhbXZpZHpwcm8uY29tL2NhbmFsLnBocD9zdHJlYW09ZHNwb3J0cw==";

        // Dekode epi mete lyen an dirèkteman nan bouton an
        try {
            const lyenDirek = atob(kodMatch);
            document.getElementById('play-link').href = lyenDirek;
        } catch(e) {
            console.error("Erreur nan lyen an.");
        }
    </script>

</body>
</html>
