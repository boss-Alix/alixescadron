<!DOCTYPE html>
<html lang="hat">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alifoot - Gade Grand Final la an Dirèk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        header h1 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            font-weight: 800;
        }
        .badge {
            background-color: #e50914;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .video-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #1f2635;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .info-section {
            margin-top: 25px;
            text-align: center;
            width: 100%;
            background: #151a24;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2635;
        }
        .info-section h2 {
            font-size: 18px;
            color: #38ef7d;
            margin-bottom: 8px;
        }
        .info-section p {
            color: #a0aab5;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn-reload {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-reload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        .btn-reload:active {
            transform: translateY(0);
        }
        footer {
            background-color: #07090d;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #4a5568;
            border-top: 1px solid #111;
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">EN DIRECT</span>
        <h1>⚽ alifoot</h1>
    </header>

    <main>
        <div class="video-wrapper">
            <div class="video-container">
                <iframe 
                    id="player-final" 
                    allowfullscreen="true" 
                    scrolling="no" 
                    allow="encrypted-media"
                    src="">
                </iframe>
            </div>
        </div>

        <div class="info-section">
            <h2>Sipò Teknik</h2>
            <p>Si videyo a bloke, li rete blanch, oswa si match la koupe, klike sou bouton anba a pou rafrechi jwè a.</p>
            <button class="btn-reload" onclick="reloadPlayer()">RAFRECHI MATCH LA</button>
        </div>
    </main>

    <footer>
        &copy; 2026 alifoot - Tout dwa rezève. Pwojè Final.
    </footer>

    <script>
        // Lyen an Base64 ki mennen sou kouran match la
        const kodMatch = "aHR0cHM6Ly9sYXRhbXZpZHpwcm8uY29tL2NhbmFsLnBocD9zdHJlYW09ZHNwb3J0cw==";

        function initPlayer() {
            try {
                const lyenDirek = atob(kodMatch);
                document.getElementById('player-final').src = lyenDirek;
            } catch(e) {
                console.error("Erreur nan dekodaj lyen an.");
            }
        }

        function reloadPlayer() {
            const iframe = document.getElementById('player-final');
            const currentSrc = iframe.src;
            iframe.src = '';
            setTimeout(() => {
                iframe.src = currentSrc;
            }, 150);
        }

        // Lanse match la otomatikman lè paj la pare
        window.onload = initPlayer;
    </script>

</body>
</html>
