<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliQuiz - Session de Jeu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(16, 24, 48, 0.95);
            --accent: #00d2ff;
            --accent-hover: #ffeaa7;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --success: #2ed573;
            --danger: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1c2e 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ---------------- Header & Profil (Menm jan ak Dashboard) ---------------- */
        .header-nav {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            background: #2d3748;
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .username-display { font-size: 0.95rem; font-weight: 600; color: #fff; }
        
        .coins-pill {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        /* ---------------- Ka jwèt la (Quiz Card) ---------------- */
        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Stats Bar anndan jwèt la */
        .game-stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .stat-item { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .stat-item span { color: var(--accent); font-weight: bold; }

        /* Ti Revey la (Timer CSS) */
        .timer-box {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: var(--danger);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }
        .timer-box.warning {
            animation: pulse 0.5s infinite alternate;
        }

        /* Zòn Kesyon an */
        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Bouton Repons yo */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 14px;
            text-align: left;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 210, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .option-btn:disabled { cursor: not-allowed; }

        /* Koulè lè reponn */
        .option-btn.correct {
            background: rgba(46, 213, 115, 0.2) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: rgba(255, 71, 87, 0.2) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
        }

        /* Bouton Swivan (Action Bar) */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            min-height: 50px;
        }

        .next-btn {
            background: linear-gradient(90deg, #00d2ff 0%, #00a8ff 100%);
            color: #0a0e1a;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: none; /* L ap parèt sèlman lè moun nan fin klike */
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .next-btn:hover {
            transform: scale(1.03);
            background: var(--accent-hover);
        }

        /* ---------------- Notifikasyon Custom ---------------- */
        .toast-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 16px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 5px solid transparent;
        }
        .toast-notification.active { transform: translateX(0); }
        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Quitter
        </a>
        <div class="user-profile-box">
            <div class="user-info-text">
                <span class="username-display" id="user-name">Chargement...</span>
                <span class="coins-pill"><i class="fa-solid fa-coins"></i> <span id="user-coins">0</span> AC</span>
            </div>
            <img src="" alt="Avatar" class="user-avatar" id="user-avatar" onerror="this.src='https://via.placeholder.com/150'">
        </div>
    </header>

    <main class="quiz-container">
        <div class="game-stats-bar">
            <div class="stat-item">Aparey: <span id="current-system">-</span></div>
            <div class="stat-item">Question: <span id="question-counter">0/15</span></div>
            
            <div class="timer-box" id="timer-display">
                <i class="fa-solid fa-clock"></i> <span id="seconds-left">15</span>s
            </div>
        </div>

        <div class="question-text" id="question-box">Chargement de la question...</div>

        <div class="options-grid" id="options-box">
            </div>

        <div class="action-bar">
            <button class="next-btn" id="btn-next" onclick="nextQuestion()">
                Swivan <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

    <div class="toast-notification" id="toast-notif">
        <i id="toast-icon" class="fa-solid"></i>
        <span id="toast-message">Mesaj</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        // Konfigirasyon Firebase ou a
        const firebaseConfig = {
            apiKey: "AIzaSyCF2I4LEcMA1oJRwa7xthvSOQGSCg6lPjs",
            authDomain: "aliquiz-509.firebaseapp.com",
            projectId: "aliquiz-509",
            storageBucket: "aliquiz-509.firebasestorage.app",
            messagingSenderId: "319472495068",
            appId: "1:319472495068:web:092e0b9efb14dae8f60719"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Paramèt Jwèt la
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLimit = 15;
        let currentCoins = 0;
        let currentUserDocRef = null;

        // Ranmase Paramèt ki nan URL la (Aparèy ak Nivo)
        const urlParams = new URLSearchParams(window.location.search);
        const selectedSystem = urlParams.get('system') || "Appareil digestif";
        const selectedLevel = parseInt(urlParams.get('level')) || 1;

        // OnAuthStateChanged: Tcheke si Itilizatè a konekte epi pran pwofil li
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(currentUserDocRef);
                
                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    currentCoins = userData.coins || 0;
                    
                    // Afiche Done Pwofil yo
                    document.getElementById('user-name').innerText = userData.username || "Joueur";
                    document.getElementById('user-coins').innerText = currentCoins;
                    if (userData.avatarUrl) {
                        document.getElementById('user-avatar').src = userData.avatarUrl;
                    }
                }
                // Chaje kesyon yo apre nou fin gen enfòmasyon itilizatè a
                loadGameQuestions();
            } else {
                window.location.href = "login.html"; // Redirije si l pa konekte
            }
        });

        // Chaje kesyon ki soti nan Firestore
        async function loadGameQuestions() {
            document.getElementById('current-system').innerText = selectedSystem;
            
            try {
                const qRef = collection(db, "questions");
                const q = query(qRef, where("system", "==", selectedSystem), where("level", "==", selectedLevel));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    currentQuestions.push(doc.data());
                });

                // Triye kesyon yo yon fason oza (Randomize)
                currentQuestions.sort(() => Math.random() - 0.5);

                // Limite a 15 kesyon pou sesyon an
                if (currentQuestions.length > 15) {
                    currentQuestions = currentQuestions.slice(0, 15);
                }

                if (currentQuestions.length === 0) {
                    document.getElementById('question-box').innerText = "Aucune question trouvée pour ce niveau.";
                    return;
                }

                showQuestion();

            } catch (error) {
                console.error("Erreur chargement done:", error);
                showToast("Erreur de chargement des questions.", "error");
            }
        }

        // Afiche Kesyon Kouran an
        function showQuestion() {
            clearInterval(timerInterval); // Rete ansyen revey la
            
            const qData = currentQuestions[currentIndex];
            
            document.getElementById('question-counter').innerText = `${currentIndex + 1}/${currentQuestions.length}`;
            document.getElementById('question-box').innerText = qData.question;
            document.getElementById('btn-next').style.display = 'none'; // Kache bouton swivan an

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = "";

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, qData.answer);
                optionsBox.appendChild(btn);
            });

            startTimer(); // Lanse nouvo reveye 15s la
        }

        // Kontwòl Ti Revey 15 segonn lan
        function startTimer() {
            let timeLeft = timeLimit;
            const timerDisplay = document.getElementById('seconds-left');
            const timerBox = document.getElementById('timer-display');
            
            timerDisplay.innerText = timeLeft;
            timerBox.classList.remove('warning');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 5) {
                    timerBox.classList.add('warning'); // Fè l flashe lè l prèske fini
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout(); // Moun lan pèdi tan
                }
            }, 1000);
        }

        // Lè 15 segonn lan fini san l pa chwazi anyen
        function handleTimeout() {
            disableAllOptions();
            const correctAnswer = currentQuestions[currentIndex].answer;
            highlightCorrect(correctAnswer);
            
            showToast("Temps écoulé ! ⏱️", "error");
            document.getElementById('btn-next').style.display = 'inline-flex'; // Montre bouton swivan an
        }

        // Tcheke si Repons lan bon
        async function checkAnswer(selectedBtn, chosenOpt, correctOpt) {
            clearInterval(timerInterval); // Rete revey la imedyatman
            disableAllOptions();

            if (chosenOpt === correctOpt) {
                selectedBtn.classList.add('correct');
                score++;
                
                // Kalkile ak ajoute Coins yo (Pa egzanp: 10 coins pa bon repons)
                currentCoins += 10;
                document.getElementById('user-coins').innerText = currentCoins;
                
                // Mete Firestore ajou imedyatman nan background lan
                if (currentUserDocRef) {
                    await updateDoc(currentUserDocRef, { coins: currentCoins });
                }

                showToast("Bonne réponse ! +10 AC 🌟", "success");
            } else {
                selectedBtn.classList.add('wrong');
                highlightCorrect(correctOpt); // Limen bon repons lan an vèt
                showToast("Mauvaise réponse ! ❌", "error");
            }

            document.getElementById('btn-next').style.display = 'inline-flex'; // Montre bouton swivan an pou l ka kontinye
        }

        // Limen bon repons lan an vèt
        function highlightCorrect(correctAnswer) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                if (btn.innerText === correctAnswer) {
                    btn.classList.add('correct');
                }
            });
        }

        // Bloke tout bouton yo pou l pa klike de fwa
        function disableAllOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        // Fonksyon bouton Swivan (Manual Next)
        window.nextQuestion = function() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion();
            } else {
                // Finisman jwèt la, voye l sou paj rezilta
                window.location.href = `resultat.html?score=${score}&total=${currentQuestions.length}&level=${selectedLevel}&system=${selectedSystem}`;
            }
        };

        // Bèl Notifikasyon Custom (Menm jan ak Dashboard la)
        function showToast(message, type) {
            const toast = document.getElementById('toast-notif');
            const icon = document.getElementById('toast-icon');
            const msgSpan = document.getElementById('toast-message');

            msgSpan.innerText = message;
            toast.className = "toast-notification active";

            if (type === "success") {
                toast.classList.add('toast-success');
                icon.className = "fa-solid fa-circle-check";
                icon.style.color = "var(--success)";
            } else {
                toast.classList.add('toast-error');
                icon.className = "fa-solid fa-circle-exclamation";
                icon.style.color = "var(--danger)";
            }

            // Kache l apre 2.5 segonn
            setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }
    </script>
</body>
</html>
